name: cleer_workspace
publish_to: none

environment:
  sdk: ^3.10.4

workspace:
  - apps/cleer_user
  - packages/cleer_ui
  - packages/cleer_core
  - packages/cleer_api

dev_dependencies:
  melos: ^7.7.0

melos:
  command:
    bootstrap:
      # Keeps your MacBook Pro M2 Pro and IntelliJ/VS Code in sync
      useIntellij: true

  scripts:
    # --- Code Generation ---
    generate:
      run: melos exec --depends-on="build_runner" -- "dart run build_runner build -d"
      description: Build code generation for all applicable packages (Freezed, JSON Serializer, etc.).

    generate:watch:
      run: melos exec --depends-on="build_runner" -- "dart run build_runner watch -d"
      description: 'Active development mode: watches for changes and rebuilds.'

    # --- Amplify Gen 2: Configuration & Pulling ---
    amplify:sandbox:
      run: npx ampx sandbox --outputs-format dart --outputs-out-dir apps/cleer_user/lib --profile cleer --stream-function-logs
      description: Start local sandbox and output config directly to the user app.

    amplify:pull:develop:
      run: npx ampx generate outputs --app-id d13yzvq5dhw2v2 --branch develop --format dart --out-dir apps/cleer_user/lib --profile cleer
      description: Pull the latest Develop (Staging) config from AWS.

    amplify:pull:main:
      run: npx ampx generate outputs --app-id d13yzvq5dhw2v2 --branch main --format dart --out-dir apps/cleer_user/lib --profile cleer
      description: Pull the latest Main (Production) config from AWS.

    amplify:models:
      run: npx ampx generate graphql-client-code --format modelgen --model-target dart --out packages/cleer_api/lib/src/models --profile cleer
      description: Generate Dart models from the schema into the API package.

    # --- Build & Deployment (Local AABs) ---
    # These chain the config pull and the build together so you never have a mismatch.

    build:aab:develop:
      run: |
        melos run amplify:pull:develop && \
        cd apps/cleer_user && \
        flutter build aab --release --obfuscate --split-debug-info=build/app/outputs/symbols --dart-define=APP_ENV=develop && \
        dart run sentry_dart_plugin
      description: Pulls staging config, builds AAB, and uploads symbols to Sentry.

    build:aab:main:
      run: |
        melos run amplify:pull:main && \
        cd apps/cleer_user && \
        flutter build aab --release --obfuscate --split-debug-info=build/app/outputs/symbols --dart-define=APP_ENV=main && \
        dart run sentry_dart_plugin
      description: Pulls production config, builds AAB, and uploads symbols to Sentry.

    # --- Build & Deployment (iOS IPAs) ---
    build:ipa:develop:
      run: |
        melos run amplify:pull:develop && \
        cd apps/cleer_user && \
        flutter build ipa --release --obfuscate --split-debug-info=build/ios/outputs/symbols --dart-define=APP_ENV=develop && \
        dart run sentry_dart_plugin
      description: Pulls staging config, builds IPA, and uploads symbols to Sentry.

    build:ipa:main:
      run: |
        melos run amplify:pull:main && \
        cd apps/cleer_user && \
        flutter build ipa --release --obfuscate --split-debug-info=build/ios/outputs/symbols --dart-define=APP_ENV=main && \
        dart run sentry_dart_plugin
      description: Pulls production config, builds IPA, and uploads symbols to Sentry.

    # --- Maintenance ---
    clean:
      run: melos exec -- "flutter clean"
      description: Clean all packages.

    deep_clean:
      run: |
        melos exec -- "flutter clean" && \
        melos exec -- "rm -rf pubspec.lock" && \
        melos bootstrap
      description: 'The "Nuke" option: cleans everything, deletes locks, and re-bootstraps.'

    get:
      run: melos exec -c 1 -- "flutter pub get"
      description: Get dependencies for all packages sequentially to avoid race conditions.