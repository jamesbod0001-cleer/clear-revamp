name: cleer_workspace
publish_to: none

environment:
  sdk: ^3.10.4

workspace:
  - apps/cleer_user
  - packages/cleer_ui
  - packages/cleer_core
  - packages/cleer_api

dev_dependencies:
  melos: ^7.7.0

melos:
  command:
    bootstrap:
      # This ensures your MacBook Pro / IntelliJ setup stays synced
      useIntellij: true

  scripts:
    # --- Code Generation ---
    generate:
      # Added --depends-on to skip packages that don't use build_runner (faster!)
      run: melos exec --depends-on="build_runner" -- "dart run build_runner build -d"
      description: Build code generation for all applicable packages.

    generate:watch:
      # Use this when you're actively coding in one package
      run: melos exec --depends-on="build_runner" -- "dart run build_runner watch -d"
      description: Watch and build code generation.

    # --- Amplify Gen 2 (Cleer API & App) ---
    amplify:sandbox:
      run: npx ampx sandbox --outputs-format dart --outputs-out-dir apps/cleer_user/lib --profile cleer
      description: Start sandbox and output config to the user app.

    amplify:models:
      run: npx ampx generate graphql-client-code --format modelgen --model-target dart --out packages/cleer_api/lib/src/models --profile cleer
      description: Generate models specifically into the cleer_api package.

    # --- Build & Deployment ---
    build:apk:staging:
      run: |
        cd apps/cleer_user && \
        flutter build apk --obfuscate --split-debug-info=build/app/outputs/symbols --dart-define=APP_ENV=staging && \
        dart run sentry_dart_plugin
      description: Build staging APK and upload Sentry symbols.

    # --- Maintenance ---
    clean:
      run: melos exec -- "flutter clean"
      description: Clean all packages.

    get:
      # In Melos 7, a simple 'dart pub get' at root usually suffices,
      # but this ensures Flutter-specific hooks run in every package.
      run: melos exec -- "flutter pub get"
      description: Get dependencies for all packages.