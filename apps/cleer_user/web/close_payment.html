<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Status - Cleer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            color: #1a1a1a;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 36px 28px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 360px;
            width: 100%;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 22px;
            font-weight: 700;
        }
        p {
            margin: 0;
            color: #666666;
            font-size: 15px;
            line-height: 1.5;
        }
    </style>
    <script type="text/javascript">
        const urlParams = new URLSearchParams(window.location.search);
        let status = urlParams.get('status');

        // Fallback: check response JSON parameter if status isn't directly in query
        if (!status) {
            const responseParam = urlParams.get('response');
            if (responseParam) {
                try {
                    const parsed = JSON.parse(responseParam);
                    status = parsed.status;
                } catch (e) {}
            }
        }
        status = (status || '').toLowerCase();

        // Method 1: Post Message (For desktop popup windows)
        if (window.opener) {
            try {
                window.opener.postMessage({ type: "payment_status", status: status }, "*");
            } catch (e) {}
        }

        // Method 2: Local Storage Fallback
        try {
            const payload = JSON.stringify({ status: status, time: Date.now() });
            localStorage.setItem("flutterwave_payment_status", payload);
            setTimeout(() => localStorage.removeItem("flutterwave_payment_status"), 500);
        } catch (e) {}

        // Try closing popup window if allowed
        try {
            window.close();
        } catch (e) {}

        window.addEventListener('DOMContentLoaded', () => {
            const iconEl = document.getElementById('status-icon');
            const titleEl = document.getElementById('status-title');
            const msgEl = document.getElementById('status-msg');

            if (status === 'successful' || status === 'completed') {
                if (iconEl) iconEl.textContent = '✅';
                if (titleEl) titleEl.textContent = 'Payment Successful';
                if (msgEl) msgEl.textContent = 'Please return to the Cleer app to view your agreement.';
            } else if (status === 'cancelled') {
                if (iconEl) iconEl.textContent = '❌';
                if (titleEl) titleEl.textContent = 'Payment Cancelled';
                if (msgEl) msgEl.textContent = 'Please return to the Cleer app to try again or select another payment method.';
            } else if (status === 'failed') {
                if (iconEl) iconEl.textContent = '⚠️';
                if (titleEl) titleEl.textContent = 'Payment Failed';
                if (msgEl) msgEl.textContent = 'Please return to the Cleer app to try again.';
            } else {
                if (iconEl) iconEl.textContent = '🔄';
                if (titleEl) titleEl.textContent = 'Payment Processed';
                if (msgEl) msgEl.textContent = 'Please return to the Cleer app to continue.';
            }
        });
    </script>
</head>
<body>
    <div class="card">
        <div id="status-icon" class="icon">🔄</div>
        <h2 id="status-title">Processing Payment...</h2>
        <p id="status-msg">Please return to the Cleer app to continue.</p>
    </div>
</body>
</html>
