<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Payment...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            color: #1a1a1a;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 36px 28px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 360px;
            width: 100%;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 22px;
            font-weight: 700;
        }
        p {
            margin: 0 0 24px 0;
            color: #666666;
            font-size: 15px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 20px;
            background-color: #000000;
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            box-sizing: border-box;
            transition: background-color 0.2s ease;
        }
        .btn:active {
            background-color: #333333;
        }
    </style>
    <script type="text/javascript">
        const urlParams = new URLSearchParams(window.location.search);
        const status = urlParams.get('status') || 'cancelled';

        // Method 1: Post Message (For standard desktop browsers / web popup)
        if (window.opener) {
            try {
                window.opener.postMessage({ type: "payment_status", status: status }, "*");
            } catch (e) {}
        }

        // Method 2: Local Storage Fallback (For web apps)
        try {
            const payload = JSON.stringify({ status: status, time: Date.now() });
            localStorage.setItem("flutterwave_payment_status", payload);
            setTimeout(() => localStorage.removeItem("flutterwave_payment_status"), 500);
        } catch (e) {}

        window.addEventListener('DOMContentLoaded', () => {
            const origin = window.location.origin.toLowerCase();
            const isStaging = origin.includes('staging');
            const scheme = isStaging ? 'cleerstaging' : 'cleer';
            const customSchemeUrl = scheme + '://close_payment.html' + window.location.search;

            const btn = document.getElementById('return-btn');
            if (btn) {
                btn.href = customSchemeUrl;
            }

            // Auto-redirect to custom app scheme
            setTimeout(() => {
                window.location.href = customSchemeUrl;
            }, 300);
        });

        // Try closing pop-up tab if allowed
        try {
            window.close();
        } catch (e) {}
    </script>
</head>
<body>
    <div class="card">
        <h2>Payment Complete</h2>
        <p>Returning you to the Cleer app...</p>
        <a id="return-btn" href="#" class="btn">Return to Cleer App</a>
    </div>
</body>
</html>
