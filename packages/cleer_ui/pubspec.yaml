name: cleer_ui
description: "A new Flutter package project."
version: 0.0.1
homepage:
publish_to: 'none'

environment:
  sdk: ^3.11.5
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cleer_core:
    path: ../cleer_core
  intl: ^0.20.2
  go_router: ^17.0.1
  hooks_riverpod: ^3.1.0
  flutter_hooks: ^0.21.3+1
#  phosphor_flutter: ^2.1.0
  phosphor_flutter:
    git:
      url: https://github.com/subarnaPdl/phosphor_icons.git
      ref: main
  gap: ^3.0.1
  pinput: ^6.0.1
  flutter_svg: ^2.2.3
  blurhash_dart: ^1.2.1
  path_provider: ^2.1.5
  image: ^4.8.0
  path: ^1.9.1
  flutter_blurhash: ^0.9.1
  cached_network_image: ^3.4.1
  octo_image: ^2.1.0
  dotted_line: ^3.2.3
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.5
  flutter_gen_runner: ^5.13.0+1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true
  fonts:
    - family: RethinkSans
      fonts:
        - asset: assets/fonts/Rethink_Sans/RethinkSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rethink_Sans/RethinkSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Rethink_Sans/RethinkSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rethink_Sans/RethinkSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Rethink_Sans/RethinkSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rethink_Sans/RethinkSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Rethink_Sans/RethinkSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/Rethink_Sans/RethinkSans-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Rethink_Sans/RethinkSans-ExtraBold.ttf
          weight: 800
  assets:
    - assets/images/
#    - assets/icons/


flutter_gen:
  output: lib/generated/
  assets:
    outputs:
      package_parameter_enabled: true
  integrations:
    image: true
    flutter_svg: true
  fonts:
    enabled: false